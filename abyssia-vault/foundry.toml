[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
fuzz = { runs = 1000 }
ignored_warnings_from = ["node_modules"]
# Tests and the testnet deploy script read Uniswap's official v3 build artifacts
# (v3 is not deployed on Arc testnet).
fs_permissions = [
    { access = "read", path = "./node_modules/@uniswap/v3-core/artifacts" },
    { access = "read", path = "./node_modules/@uniswap/v3-periphery/artifacts" },
    { access = "read", path = "./node_modules/@uniswap/swap-router-contracts/artifacts" },
]

[fmt]
line_length = 110
